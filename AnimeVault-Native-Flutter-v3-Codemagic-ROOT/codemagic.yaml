workflows:
  android-debug:
    name: AnimeVault Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform if needed
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name animevault .
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
